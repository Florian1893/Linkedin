<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
@font-face{font-family:'Caveat';font-weight:700;src:url(caveat-700.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#f4f2ee;font-family:'Inter',Helvetica,Arial,sans-serif;color:#1d1d1b;}
.lab{position:absolute;left:70px;font-size:22px;letter-spacing:2px;text-transform:uppercase;color:#8a867d;font-weight:500;}
.gross{position:absolute;left:62px;top:150px;font-size:250px;font-weight:800;letter-spacing:-12px;line-height:1;font-variant-numeric:tabular-nums;}
.klein{position:absolute;left:70px;top:1000px;font-size:120px;font-weight:800;letter-spacing:-4px;line-height:1;color:#c62828;}
.d{font-size:26px;color:#6f6c64;font-weight:500;letter-spacing:0;margin-top:14px;}
.pfeil{position:absolute;left:0;top:0;width:1080px;height:1350px;}
.hand{position:absolute;left:480px;top:1030px;font-family:'Caveat',cursive;font-weight:700;color:#c62828;font-size:84px;transform:rotate(-4deg);white-space:nowrap;}
.fuss{position:absolute;left:70px;bottom:56px;font-size:24px;color:#8a867d;}
</style></head><body>
<div class="s">
  <div class="lab" style="top:110px">Mein bester Post</div>
  <div class="gross">215'908<div class="d">Impressions, 2. Oktober</div></div>
  <svg class="pfeil" viewBox="0 0 1080 1350"><path d="M 300 500 C 330 680 220 780 160 885" fill="none" stroke="#1d1d1b" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 18"/><path d="M 134 858 L 160 898 L 196 870" fill="none" stroke="#1d1d1b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="lab" style="top:960px">Einer meiner letzten</div>
  <div class="klein">120<div class="d">Impressions, 17. November</div></div>
  <div class="hand">Was ist passiert?</div>
  <div class="fuss">Gleiches Profil. Gleiche Zielgruppe. Fast die gleiche Bauart.</div>
</div>
</body></html>
