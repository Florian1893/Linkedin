<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#111;font-family:'Inter',Helvetica,Arial,sans-serif;}
.ph{position:absolute;left:-130px;top:-110px;width:1210px;height:auto;}
.shade{position:absolute;left:0;right:0;bottom:0;height:64%;
 background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 28%,rgba(0,0,0,.66) 55%,rgba(0,0,0,.86) 100%);}
svg{position:absolute;left:0;top:0;width:1080px;height:1350px;}
.lab{position:absolute;left:80px;bottom:452px;color:#fff;opacity:.92;font-size:34px;font-weight:400;letter-spacing:.2px;text-shadow:0 2px 12px rgba(0,0,0,.7);}
.old{position:absolute;left:80px;bottom:330px;color:#fff;opacity:.95;font-size:70px;font-weight:400;letter-spacing:-1px;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.75);}
.new{position:absolute;left:80px;bottom:150px;color:#fff;font-size:118px;font-weight:500;letter-spacing:-3px;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.6);}
.sub{position:absolute;left:80px;bottom:78px;color:#fff;opacity:.8;font-size:30px;font-weight:400;}
</style></head><body>
<div class="s">
  <img class="ph" src="foto2.jpg">
  <div class="shade"></div>
  <svg id="a" viewBox="0 0 1080 1350"></svg>
  <div class="lab">Eine Offerte schreiben, vorher:</div>
  <div class="old">30 bis 45 Minuten</div>
  <div class="new">5 Minuten.</div>
  <div class="sub">Eingesprochen statt abgetippt.</div>
</div>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script>
const A=document.getElementById('a'), r=rough.svg(A);
const o=(c,w,s)=>({stroke:c,strokeWidth:w,roughness:2.1,bowing:2.2,seed:s});
A.appendChild(r.line(74,988,640,976,o('#e5453d',9,3)));
A.appendChild(r.line(82,1004,632,996,o('#e5453d',5,4)));
A.appendChild(r.line(78,1204,586,1196,o('#3fb950',9,7)));
A.appendChild(r.line(86,1220,578,1214,o('#3fb950',5,8)));
window.__ready={rough:typeof rough,n:A.childElementCount};
</script></body></html>
