<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0b0d12;font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;}
.ph{position:absolute;left:-130px;top:-110px;width:1210px;height:auto;}
.band{position:absolute;left:0;right:0;bottom:0;height:620px;
 background:linear-gradient(180deg,rgba(11,13,18,0) 0%,rgba(11,13,18,.88) 14%,rgba(11,13,18,.96) 100%);}
.ctx{position:absolute;left:72px;top:0;font-size:36px;font-weight:400;opacity:.78;letter-spacing:.3px;}
.old{position:absolute;left:72px;font-size:88px;font-weight:500;letter-spacing:-2px;line-height:1;opacity:.92;}
.big{position:absolute;left:60px;display:flex;align-items:baseline;gap:22px;line-height:1;}
.big .n{font-size:392px;font-weight:800;letter-spacing:-18px;color:#4ade80;}
.big .u{font-size:104px;font-weight:800;letter-spacing:-3px;color:#4ade80;}
.foot{position:absolute;left:72px;font-size:38px;font-weight:500;opacity:.95;}
svg{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none;}
</style></head><body>
<div class="s">
  <img class="ph" src="foto2.jpg">
  <div class="band"></div>
  <div class="ctx" style="top:786px;">Eine Offerte schreiben. Vorher:</div>
  <div class="old" style="top:846px;">30 bis 45 Minuten</div>
  <div class="big" style="top:930px;"><span class="n">5</span><span class="u">Minuten</span></div>
  <div class="foot" style="top:1268px;">Eingesprochen statt abgetippt.</div>
  <svg id="a" viewBox="0 0 1080 1350"></svg>
</div>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script>
const A=document.getElementById('a'), r=rough.svg(A);
const o=(c,w,s)=>({stroke:c,strokeWidth:w,roughness:2.2,bowing:2.4,seed:s});
// "30 bis 45 Minuten" bei top 846, 88px -> Mitte ca. y 892, Breite ca. 72..790
A.appendChild(r.line(66,896,796,884,o('#ef4444',12,3)));
A.appendChild(r.line(74,914,788,906,o('#ef4444',6,4)));
window.__ready={rough:typeof rough,n:A.childElementCount};
</script></body></html>
