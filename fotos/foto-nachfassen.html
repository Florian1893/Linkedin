<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0b0d12;
   font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;}
.ph{position:absolute;left:-70px;top:-36px;width:1220px;height:auto;}
.dim{position:absolute;inset:0;background:rgba(9,11,16,.05);}
.top{position:absolute;left:0;right:0;top:0;height:520px;
 background:linear-gradient(180deg,rgba(9,11,16,.94) 0%,rgba(9,11,16,.90) 40%,rgba(9,11,16,.68) 68%,rgba(9,11,16,0) 100%);}
.bot{position:absolute;left:0;right:0;bottom:0;height:440px;
 background:linear-gradient(180deg,rgba(9,11,16,0) 0%,rgba(9,11,16,.80) 32%,rgba(9,11,16,.96) 100%);}
.kicker{position:absolute;left:72px;top:70px;font-size:25px;font-weight:500;
 letter-spacing:3.2px;text-transform:uppercase;opacity:.70;white-space:nowrap;}
.hd{position:absolute;left:68px;font-weight:800;letter-spacing:-3px;line-height:1;white-space:nowrap;
 text-shadow:0 3px 30px rgba(0,0,0,.6);}
.num{color:#8B7CF6;}
.bar{position:absolute;left:72px;top:1086px;width:96px;height:9px;background:#8B7CF6;border-radius:5px;}
.p1{position:absolute;left:72px;top:1132px;font-size:45px;font-weight:400;opacity:.92;letter-spacing:-.4px;white-space:nowrap;}
.p2{position:absolute;left:72px;top:1192px;font-size:62px;font-weight:800;letter-spacing:-2px;white-space:nowrap;}
.src{position:absolute;left:72px;top:1286px;font-size:24px;font-weight:400;opacity:.55;letter-spacing:.3px;white-space:nowrap;}
</style></head><body>
<div class="s">
  <img class="ph" src="foto3.jpg">
  <div class="dim"></div>
  <div class="top"></div>
  <div class="bot"></div>

  <div class="kicker">Bitkom 2025 &middot; 504 Handwerksbetriebe befragt</div>
  <div class="hd" style="top:118px;font-size:96px;"><span class="num">97 von 100</span> sagen:</div>
  <div class="hd" style="top:236px;font-size:78px;">Kunden erwarten</div>
  <div class="hd" style="top:326px;font-size:78px;">schnellere Antworten.</div>

  <div class="bar"></div>
  <div class="p1">Gemeint ist immer die erste.</div>
  <div class="p2">Die zweite bleibt liegen.</div>
  <div class="src">Quelle: Bitkom Research, Handwerk 2025, 504 befragte Betriebe</div>
</div>
</body></html>
