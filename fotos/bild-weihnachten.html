<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
@font-face{font-family:'Caveat';font-weight:700;src:url(caveat-700.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 10%,#3a2a22 0%,#1f1612 60%,#0f0b09 100%);font-family:'Inter',Helvetica,Arial,sans-serif;}
.licht{position:absolute;border-radius:50%;filter:blur(18px);}
.handy{position:absolute;left:250px;top:120px;width:580px;height:1160px;border-radius:78px;background:#0b0b0c;padding:18px;box-shadow:0 40px 90px rgba(0,0,0,.7);transform:rotate(-3deg);transform-origin:50% 50%;}
.screen{width:100%;height:100%;border-radius:62px;overflow:hidden;position:relative;
 background:radial-gradient(120% 70% at 50% 0%,#5a3b2c 0%,#2a1c15 55%,#120c09 100%);color:#fff;text-align:center;padding-top:90px;}
.tag{font-size:34px;font-weight:500;opacity:.9;}
.uhr{font-size:150px;font-weight:800;letter-spacing:-5px;line-height:1.05;margin-top:4px;}
.n{margin:22px 24px 0;padding:22px 24px;border-radius:30px;background:rgba(255,255,255,.17);text-align:left;}
.n .k{display:flex;justify-content:space-between;font-size:22px;opacity:.8;}
.n .t{font-size:28px;font-weight:800;margin-top:6px;}
.n .b{font-size:27px;line-height:1.3;margin-top:4px;}
.n.klein{padding:18px 24px;}
.rot{position:absolute;font-family:'Caveat',cursive;font-weight:700;color:#ff6b5e;white-space:nowrap;line-height:1;transform-origin:0 0;font-size:96px;transform:rotate(-7deg);}
svg.mk{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:visible;pointer-events:none;}
</style></head><body>
<div class="s" id="s">
  <div class="licht" style="left:60px;top:180px;width:70px;height:70px;background:rgba(255,190,90,.55)"></div>
  <div class="licht" style="left:140px;top:420px;width:50px;height:50px;background:rgba(255,120,80,.45)"></div>
  <div class="licht" style="left:900px;top:240px;width:80px;height:80px;background:rgba(255,200,110,.5)"></div>
  <div class="licht" style="left:960px;top:620px;width:56px;height:56px;background:rgba(255,140,90,.45)"></div>
  <div class="licht" style="left:80px;top:900px;width:64px;height:64px;background:rgba(255,210,120,.4)"></div>
  <div class="licht" style="left:930px;top:1050px;width:70px;height:70px;background:rgba(255,170,90,.45)"></div>
  <div class="handy"><div class="screen">
    <div class="tag">Donnerstag, 24. Dezember</div>
    <div class="uhr">09:15</div>
    <div class="n"><div class="k"><span>Mail</span><span>jetzt</span></div><div class="t">Rechnung 2026</div><div class="b" id="rg">Ohne Rechnung k&#246;nnen wir dieses Jahr nichts mehr buchen.</div></div>
    <div class="n"><div class="k"><span>Mail</span><span>gestern</span></div><div class="t">Treuhand</div><div class="b">Belege 2026 bitte bis 31.12. einreichen.</div></div>
    <div class="n klein"><div class="t">47 ungelesene Mails</div></div>
  </div></div>
  <div class="rot" id="r1">Betriebsferien.</div>
  <svg class="mk" id="mk" viewBox="0 0 1080 1350"></svg>
</div>
<script>
document.fonts.ready.then(()=>{
  const S=document.getElementById('s').getBoundingClientRect();
  const r1=document.getElementById('r1');r1.style.left='90px';r1.style.top='1150px';
  const R=r1.getBoundingClientRect();const y=R.bottom-S.top+4;
  document.getElementById('mk').innerHTML=`<path d="M ${R.left-S.left} ${y+14} Q ${(R.left+R.right)/2-S.left} ${y-6} ${R.right-S.left+10} ${y-40}" fill="none" stroke="#ff6b5e" stroke-width="7" stroke-linecap="round" opacity=".9"/>`;
  window.__ok={notiz:[Math.round(R.left-S.left),Math.round(R.right-S.left),Math.round(R.bottom-S.top)]};
});
</script></body></html>
