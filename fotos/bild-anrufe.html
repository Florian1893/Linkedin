<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;
   background:radial-gradient(120% 80% at 50% 0%,#1b2233 0%,#0e1118 62%,#0b0d12 100%);
   font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;padding:72px 64px;}
.time{font-size:132px;font-weight:300;letter-spacing:-5px;line-height:1;opacity:.96;}
.day{font-size:31px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;opacity:.5;margin-top:14px;}
.stack{margin-top:62px;display:flex;flex-direction:column;gap:20px;}
.card{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.10);
 border-radius:26px;padding:26px 30px 28px;}
/* keine Markierung: der Leser soll selber suchen, welche der vier wirklich zum Chef gehoert */
.row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;}
.who{font-size:29px;font-weight:800;letter-spacing:.2px;opacity:.72;}
.when{font-size:26px;font-weight:400;opacity:.42;}
.msg{font-size:41px;font-weight:500;letter-spacing:-.6px;line-height:1.24;}
.foot{position:absolute;left:64px;right:64px;bottom:76px;}
.bar{width:92px;height:9px;background:#8B7CF6;border-radius:5px;margin-bottom:30px;}
.f1{font-size:45px;font-weight:400;opacity:.88;letter-spacing:-.4px;line-height:1.3;}
.f2{font-size:52px;font-weight:800;letter-spacing:-1.4px;margin-top:8px;}
</style></head><body>
<div class="s">
  <div class="time">06:55</div>
  <div class="day">Donnerstag</div>

  <div class="stack">
    <div class="card">
      <div class="row"><span class="who">Marco</span><span class="when">06:34</span></div>
      <div class="msg">Steigzone liegt woanders als im Plan</div>
    </div>
    <div class="card">
      <div class="row"><span class="who">Reto</span><span class="when">06:41</span></div>
      <div class="msg">Hahnen für 80 Franken, soll ich wechseln?</div>
    </div>
    <div class="card">
      <div class="row"><span class="who">Sandro</span><span class="when">06:47</span></div>
      <div class="msg">Ist das jetzt Regie oder ist das drin?</div>
    </div>
    <div class="card">
      <div class="row"><span class="who">Patrick</span><span class="when">06:52</span></div>
      <div class="msg">Teil ist nicht geliefert, hol ich es selber?</div>
    </div>
  </div>

  <div class="foot">
    <div class="bar"></div>
    <div class="f1">Eine davon gehört wirklich zu dir.</div>
    <div class="f2">Die anderen drei nicht.</div>
  </div>
</div>
</body></html>
