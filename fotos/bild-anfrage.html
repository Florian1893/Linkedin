<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;
 background:radial-gradient(120% 85% at 20% 2%,#1d2434 0%,#111620 58%,#0b0e14 100%);
 font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;padding:58px 64px 0;}
.kick{font-size:27px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;opacity:.52;}
h1{font-size:74px;font-weight:800;letter-spacing:-2.6px;line-height:1.05;margin-top:14px;}
h1 em{font-style:normal;color:#ef4444;}
.tl{margin-top:60px;position:relative;padding-left:76px;}
.line{position:absolute;left:21px;top:16px;bottom:74px;width:5px;border-radius:3px;
 background:linear-gradient(#8B7CF6 0%,#3a4255 22%,#3a4255 74%,#ef4444 100%);}
.e{position:relative;margin-bottom:78px;}
.dot{position:absolute;left:-76px;top:6px;width:47px;height:47px;border-radius:50%;
 background:#232b3c;border:5px solid #0f131c;}
.e.start .dot{background:#8B7CF6;}
.e.end .dot{background:#ef4444;}
.d{font-size:26px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;opacity:.5;}
.e.start .d,.e.end .d{opacity:1;}
.e.start .d{color:#8B7CF6;} .e.end .d{color:#ef4444;}
.t{font-size:43px;font-weight:800;letter-spacing:-1.2px;margin-top:8px;line-height:1.18;display:inline-block;}
.e.mid .t{font-weight:500;opacity:.66;font-size:38px;letter-spacing:-.8px;}
.quote{margin-top:22px;background:#ef4444;border-radius:20px;padding:26px 32px;display:block;width:fit-content;}
.quote span{font-size:40px;font-weight:800;letter-spacing:-1.1px;}
.foot{position:absolute;left:64px;right:64px;bottom:56px;}
.bar2{width:96px;height:9px;background:#8B7CF6;border-radius:5px;margin-bottom:20px;}
.f1{font-size:41px;font-weight:800;letter-spacing:-1.2px;line-height:1.2;}
.f2{font-size:29px;font-weight:400;opacity:.58;margin-top:12px;}
svg.mk{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none;}
</style></head><body>
<div class="s">
  <div class="kick">Eine Anfrage vom Architekten</div>
  <h1>3 Tage bis zum<br><em>R&#252;ckruf</em>.</h1>
  <div class="tl">
    <div class="line"></div>
    <div class="e start"><div class="dot"></div><div class="d">Montag 07:40</div>
      <div class="t">Der Architekt fragt an.</div></div>
    <div class="e mid"><div class="dot"></div><div class="d">Montag</div>
      <div class="t">Baustelle. Lieferant. Abrechnung.</div></div>
    <div class="e mid"><div class="dot"></div><div class="d">Dienstag, Mittwoch</div>
      <div class="t">Dasselbe.</div></div>
    <div class="e end"><div class="dot"></div><div class="d">Donnerstag 16:20</div>
      <div class="t" id="tE">Du rufst zur&#252;ck.</div>
      <div class="quote"><span>&#171;Ist schon vergeben.&#187;</span></div></div>
  </div>
  <div class="foot">
    <div class="bar2"></div>
    <div class="f1">Den Auftrag bekommt nicht<br>der G&#252;nstigste.</div>
    <div class="f2">Den bekommt der Erste.</div>
  </div>
  <svg class="mk" id="mk" viewBox="0 0 1080 1350"></svg>
</div>
<script>
document.fonts.ready.then(()=>{
  const b=document.querySelector('.e.end .t').getBoundingClientRect();
  const x1=b.left-6, x2=b.right+6, y=b.bottom+3;
  const p=[];
  for(let i=0;i<=40;i++){
    const t=i/40;
    p.push((i?'L':'M')+(x1+(x2-x1)*t).toFixed(1)+' '+(y+Math.sin(t*7.4+0.4)*3.1-t*2.4).toFixed(1));
  }
  document.getElementById('mk').innerHTML=
   `<path d="${p.join(' ')}" fill="none" stroke="#ff5a4d" stroke-width="8" stroke-linecap="round" opacity=".95"/>`;
  window.__ok=true;
});
</script></body></html>
