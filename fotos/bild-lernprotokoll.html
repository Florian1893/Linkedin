<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
@font-face{font-family:'Caveat';font-weight:700;src:url(caveat-700.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;
 background:radial-gradient(120% 95% at 70% 0%,#5e6468 0%,#3a3f43 52%,#1f2225 100%);font-family:'Inter',Helvetica,Arial,sans-serif;}
svg.grain{position:absolute;left:0;top:0;width:1080px;height:1350px;mix-blend-mode:soft-light;opacity:.55;}
.paper{position:absolute;left:70px;top:95px;width:940px;height:1170px;background:linear-gradient(172deg,#fffefb 0%,#f4f1ea 100%);
 transform-origin:50% 0;box-shadow:0 46px 90px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.35);padding:62px 66px;color:#1b1b1b;}
.kopf{font-size:50px;font-weight:800;letter-spacing:-1.2px;}
.sub{font-size:24px;color:#7a776f;margin-top:8px;}
table{width:100%;border-collapse:collapse;margin-top:40px;font-size:29px;}
th{text-align:left;font-size:19px;letter-spacing:1.2px;text-transform:uppercase;color:#8a8a8a;font-weight:500;padding:0 0 14px;border-bottom:3px solid #2a2a2a;}
th.z,td.z{text-align:right;}
td{height:122px;border-bottom:2px solid #e2ddd2;vertical-align:middle;color:#2b2b2b;}
td.d{color:#7a776f;font-size:24px;}
td.z{font-weight:800;font-variant-numeric:tabular-nums;font-size:32px;}
.regel{margin-top:96px;padding:28px 32px;border:2px solid #d9d3c2;border-radius:14px;background:#fbf9f3;}
.regel .n{font-size:20px;letter-spacing:1.5px;text-transform:uppercase;color:#8a8a8a;}
.regel .t{font-size:40px;font-weight:800;letter-spacing:-.8px;margin-top:8px;}
.rot{position:absolute;font-family:'Caveat',cursive;font-weight:700;color:#c62828;white-space:nowrap;line-height:1;transform-origin:0 0;font-size:62px;transform:rotate(-5deg);}
svg.mk{position:absolute;left:0;top:0;width:940px;height:1170px;overflow:visible;pointer-events:none;}
</style></head><body>
<div class="s">
  <svg class="grain" viewBox="0 0 1080 1350"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.21" numOctaves="3" seed="61"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1350" filter="url(#g)"/></svg>
  <div class="paper" id="paper">
    <div class="kopf">Lernprotokoll LinkedIn</div>
    <div class="sub">seit 24. August 2026 &#183; 47 Regeln</div>
    <table>
      <tr><th style="width:15%">Datum</th><th>Hook</th><th class="z" style="width:24%">Impressions</th></tr>
      <tr><td class="d">2.10.</td><td>&#171;Ich h&#246;re per Ende Dezember auf.&#187;</td><td class="z">215'908</td></tr>
      <tr><td class="d">6.10.</td><td>&#171;Wir melden uns.&#187;</td><td class="z"><span id="f1">389</span></td></tr>
      <tr><td class="d">15.10.</td><td>&#171;Das habe ich doch extra gesagt.&#187;</td><td class="z">18'000</td></tr>
      <tr><td class="d">22.10.</td><td>&#171;Das war aber anders abgemacht.&#187;</td><td class="z"><span id="f2">Flop</span></td></tr>
    </table>
    <div class="regel" id="regel"><div class="n">Regel 46</div><div class="t">Nach einem Treffer nie die Kopie.</div></div>
    <svg class="mk" id="mk" viewBox="0 0 940 1170"></svg>
  </div>
</div>
<script>
document.fonts.ready.then(()=>{
  const paper=document.getElementById('paper');const P=paper.getBoundingClientRect();
  const rel=el=>{const r=el.getBoundingClientRect();return {l:r.left-P.left,t:r.top-P.top,r:r.right-P.left,b:r.bottom-P.top,w:r.width,h:r.height};};
  const red='#c62828';let svg='';
  ['f1','f2'].forEach(id=>{const z=rel(document.getElementById(id));const y=z.b+8;
    svg+=`<path d="M ${z.l-8} ${y+3} Q ${(z.l+z.r)/2} ${y-3} ${z.r+8} ${y}" fill="none" stroke="${red}" stroke-width="7" stroke-linecap="round" opacity=".9"/>`;});
  const g=rel(document.getElementById('regel'));
  const cx=(g.l+g.r)/2, cy=(g.t+g.b)/2, rx=g.w/2+22, ry=g.h/2+22;const p=[];
  for(let i=0;i<=72;i++){const a=-0.9+(i/72)*Math.PI*2*1.07;const w=1+0.02*Math.sin(a*2.2+0.5);p.push((i?'L':'M')+(cx+Math.cos(a)*rx*w).toFixed(1)+' '+(cy+Math.sin(a)*ry*w).toFixed(1));}
  svg+=`<path d="${p.join(' ')}" fill="none" stroke="${red}" stroke-width="7" stroke-linecap="round" opacity=".9"/>`;
  document.getElementById('mk').innerHTML=svg;
  paper.style.transform='rotate(1.2deg)';
  window.__ok={kreis:[Math.round(cx-rx),Math.round(cx+rx),Math.round(cy+ry)],breite:940,hoehe:1170};
});
</script></body></html>
