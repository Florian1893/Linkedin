<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;
 background:radial-gradient(120% 85% at 20% 2%,#1d2434 0%,#111620 58%,#0b0e14 100%);
 font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;padding:60px 64px 0;}
.kick{font-size:27px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;opacity:.52;}
h1{font-size:76px;font-weight:800;letter-spacing:-2.6px;line-height:1.04;margin-top:14px;}
h1 em{font-style:normal;color:#ef4444;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-top:38px;}
.c{height:162px;border-radius:20px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:1px;background:#1b2130;position:relative;}
.n{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1;}
.mo{font-size:21px;font-weight:500;opacity:.72;letter-spacing:.6px;}
.lab{font-size:20px;font-weight:800;letter-spacing:.2px;margin-top:3px;}
.c.rot{background:#ef4444;} .c.rot .n{color:#fff;}
.c.amb{background:#e0a020;} .c.amb .n{color:#10141C;}
.c.ok{background:#2f7d32;} .c.ok .n,.c.ok .lab,.c.ok .mo{color:#fff;}
.c.start{background:#8B7CF6;} .c.start .n,.c.start .lab,.c.start .mo{color:#0b0e14;}
.leg{display:flex;gap:44px;margin-top:28px;}
.lg{display:flex;align-items:center;gap:13px;font-size:30px;font-weight:800;letter-spacing:-.5px;}
.dot{width:26px;height:26px;border-radius:8px;flex:none;}
.foot{position:absolute;left:64px;right:64px;bottom:58px;}
.bar{width:96px;height:9px;background:#8B7CF6;border-radius:5px;margin-bottom:22px;}
.f1{font-size:41px;font-weight:800;letter-spacing:-1.2px;line-height:1.2;}
.f2{font-size:29px;font-weight:400;opacity:.58;margin-top:13px;}
svg.mk{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none;}
</style></head><body>
<div class="s">
  <div class="kick">Bad fertig am 12. September</div>
  <h1><em>19 Tage</em>, bis die<br>Rechnung raus war.</h1>
  <div class="grid"><div class="c ok" id="c0"><span class="n">12</span><span class="mo">Sep</span><span class="lab">fertig</span></div><div class="c amb"><span class="n">13</span></div><div class="c amb"><span class="n">14</span></div><div class="c amb"><span class="n">15</span></div><div class="c amb"><span class="n">16</span></div><div class="c amb"><span class="n">17</span></div><div class="c amb"><span class="n">18</span></div><div class="c amb"><span class="n">19</span></div><div class="c amb"><span class="n">20</span></div><div class="c rot"><span class="n">21</span></div><div class="c rot"><span class="n">22</span></div><div class="c rot"><span class="n">23</span></div><div class="c rot"><span class="n">24</span></div><div class="c rot"><span class="n">25</span></div><div class="c rot"><span class="n">26</span></div><div class="c rot"><span class="n">27</span></div><div class="c rot"><span class="n">28</span></div><div class="c rot"><span class="n">29</span></div><div class="c rot"><span class="n">30</span></div><div class="c start" id="cL"><span class="n">1</span><span class="mo">Okt</span><span class="lab">Rechnung</span></div></div>
  <div class="leg">
    <div class="lg"><span class="dot" style="background:#e0a020"></span>8 Tage Rapport</div>
    <div class="lg"><span class="dot" style="background:#ef4444"></span>11 Tage dein Pult</div>
  </div>
  <div class="foot">
    <div class="bar"></div>
    <div class="f1">L&#246;hne und Material waren<br>da l&#228;ngst bezahlt.</div>
    <div class="f2">Der Kunde hat p&#252;nktlich gezahlt.</div>
  </div>
  <svg class="mk" id="mk" viewBox="0 0 1080 1350"></svg>
</div>
<script>
document.fonts.ready.then(()=>{
  const r=document.getElementById('cL').getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, rx=r.width/2+15, ry=r.height/2+14;
  const p=[];
  for(let i=0;i<=64;i++){
    const a=(i/64)*Math.PI*2*1.07-0.6;
    const w=1+0.035*Math.sin(a*2.1+0.9);
    p.push((i?'L':'M')+(cx+Math.cos(a)*rx*w).toFixed(1)+' '+(cy+Math.sin(a)*ry*w).toFixed(1));
  }
  document.getElementById('mk').innerHTML=
   `<path d="${p.join(' ')}" fill="none" stroke="#ff5a4d" stroke-width="9" stroke-linecap="round" opacity=".95"/>`;
  window.__ok=true;
});
</script></body></html>
