<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Inter';font-weight:400;src:url(inter-2.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-3.ttf) format('truetype');}
@font-face{font-family:'Inter';font-weight:800;src:url(inter-8.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;
 background:radial-gradient(120% 85% at 20% 2%,#1d2434 0%,#111620 58%,#0b0e14 100%);
 font-family:'Inter',Helvetica,Arial,sans-serif;color:#fff;padding:66px 64px 0;}
.kick{font-size:27px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;opacity:.52;}
h1{font-size:78px;font-weight:800;letter-spacing:-2.6px;line-height:1.04;margin-top:16px;}
h1 em{font-style:normal;color:#ef4444;}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:44px;}
.c{height:172px;border-radius:22px;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:2px;background:#1b2130;position:relative;}
.n{font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1;}
.mo{font-size:22px;font-weight:500;opacity:.7;letter-spacing:.6px;}
.lab{font-size:21px;font-weight:800;letter-spacing:.2px;margin-top:3px;}
.c.rot{background:#ef4444;} .c.rot .n{color:#fff;}
.c.ok{background:#2f7d32;} .c.ok .n,.c.ok .lab,.c.ok .mo{color:#fff;}
.c.start{background:#8B7CF6;} .c.start .n,.c.start .lab,.c.start .mo{color:#0b0e14;}
.foot{position:absolute;left:64px;right:64px;bottom:64px;}
.bar{width:96px;height:9px;background:#8B7CF6;border-radius:5px;margin-bottom:24px;}
.f1{font-size:42px;font-weight:800;letter-spacing:-1.2px;line-height:1.2;}
.f2{font-size:30px;font-weight:400;opacity:.6;margin-top:14px;}
svg.mk{position:absolute;left:0;top:0;width:1080px;height:1350px;pointer-events:none;}
</style></head><body>
<div class="s">
  <div class="kick">Baustelle fertig am 12. September</div>
  <h1><em>19 Tage</em>, bis die<br>Rechnung raus war.</h1>
  <div class="grid"><div class="c ok" id="c0"><span class="n">12</span><span class="mo">Sep</span><span class="lab">fertig</span></div><div class="c rot" id="c1"><span class="n">13</span></div><div class="c rot" id="c2"><span class="n">14</span></div><div class="c rot" id="c3"><span class="n">15</span></div><div class="c rot" id="c4"><span class="n">16</span></div><div class="c rot" id="c5"><span class="n">17</span></div><div class="c rot" id="c6"><span class="n">18</span></div><div class="c rot" id="c7"><span class="n">19</span></div><div class="c rot" id="c8"><span class="n">20</span></div><div class="c rot" id="c9"><span class="n">21</span></div><div class="c rot" id="c10"><span class="n">22</span></div><div class="c rot" id="c11"><span class="n">23</span></div><div class="c rot" id="c12"><span class="n">24</span></div><div class="c rot" id="c13"><span class="n">25</span></div><div class="c rot" id="c14"><span class="n">26</span></div><div class="c rot" id="c15"><span class="n">27</span></div><div class="c rot" id="c16"><span class="n">28</span></div><div class="c rot" id="c17"><span class="n">29</span></div><div class="c rot" id="c18"><span class="n">30</span></div><div class="c start" id="c19"><span class="n">1</span><span class="mo">Okt</span><span class="lab">Rechnung</span></div></div>
  <div class="foot">
    <div class="bar"></div>
    <div class="f1">Erst ab dem 1. Oktober laufen<br>die 30 Tage Zahlungsfrist.</div>
    <div class="f2">Nicht ab dem Tag, an dem deine Mitarbeiter fertig waren.</div>
  </div>
  <svg class="mk" id="mk" viewBox="0 0 1080 1350"></svg>
</div>
<script>
document.fonts.ready.then(()=>{
  const r=document.getElementById('c19').getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, rx=r.width/2+16, ry=r.height/2+15;
  const p=[];
  for(let i=0;i<=64;i++){
    const a=(i/64)*Math.PI*2*1.07-0.6;
    const w=1+0.04*Math.sin(a*2.1+0.9);
    p.push((i?'L':'M')+(cx+Math.cos(a)*rx*w).toFixed(1)+' '+(cy+Math.sin(a)*ry*w).toFixed(1));
  }
  document.getElementById('mk').innerHTML=
   `<path d="${p.join(' ')}" fill="none" stroke="#ff5a4d" stroke-width="9" stroke-linecap="round" opacity=".95"/>`;
  window.__ok=true;
});
</script></body></html>
