<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Caveat';font-weight:400;src:url(caveat-400.ttf) format('truetype');}
@font-face{font-family:'Caveat';font-weight:700;src:url(caveat-700.ttf) format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
.s{width:1080px;height:1350px;background:#fdfcf7;position:relative;overflow:hidden;font-family:'Caveat',cursive;}
.s::after{content:'';position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(circle at 22% 14%,rgba(0,0,0,.03),transparent 55%),
            radial-gradient(circle at 80% 88%,rgba(0,0,0,.04),transparent 58%);}
.note{position:absolute;left:110px;top:230px;width:860px;height:860px;
 background:linear-gradient(180deg,#FFF3A6 0%,#FCEC94 78%,#F4E07E 100%);
 transform:rotate(-2.4deg);
 box-shadow:0 18px 34px rgba(60,50,10,.16);}
.note::before{content:'';position:absolute;left:0;right:0;top:0;height:74px;background:rgba(255,255,255,.28);}
.k{position:absolute;left:170px;right:170px;top:330px;transform:rotate(-2.4deg);
 font-weight:400;font-size:56px;color:#5a5030;letter-spacing:1px;}
.t{position:absolute;left:170px;right:150px;top:470px;transform:rotate(-2.4deg);
 font-weight:700;font-size:104px;line-height:1.08;color:#2b2b2b;}
.sub{position:absolute;left:80px;right:80px;top:1178px;text-align:center;
 font-weight:400;font-size:50px;color:#6f6a60;white-space:nowrap;}
svg{position:absolute;left:0;top:0;width:1080px;height:1350px;}
</style></head><body>
<div class="s">
  <div class="note"></div>
  <svg id="a" viewBox="0 0 1080 1350"></svg>
  <div class="k">NEUE REGEL AB HEUTE:</div>
  <div class="t">JEDE ANFRAGE<br>WIRD SOFORT<br>BESTÄTIGT.</div>
  <div class="sub">Die Offerte darf dauern. Das Schweigen nicht.</div>
</div>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script>
const A=document.getElementById('a'), r=rough.svg(A);
const o=(c,w,s)=>({stroke:c,strokeWidth:w||3,roughness:2.1,bowing:2.2,seed:s||7});
const add=n=>A.appendChild(n);
// gruene Doppel-Unterstreichung unter "AM GLEICHEN TAG" (Zeile 3 der Note)
add(r.line(178,872,700,860,o('#2f7d32',7,11)));
add(r.line(188,894,688,884,o('#2f7d32',5,12)));
// Reisszwecke oben mittig auf der Note
add(r.circle(540,266,34,o('#2b2b2b',3.4,21)));
add(r.circle(540,266,10,o('#2b2b2b',2.6,22)));
window.__ready={rough:typeof rough,n:A.childElementCount};
</script></body></html>
